databases:
  - name: hexletae
    plan: free
    databaseName: task_manager
    user: task_manager

services:
  - type: web
    plan: free
    name: task_manager
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn task_manager.wsgi'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hexletae
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4