<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Менеджер задач{% endblock %}</title>
    {% load tailwind_cli %}
    {% tailwind_css %}
</head>
<body class="bg-white min-h-screen flex flex-col">
    

    <header class="border-b border-gray-200">

    <div class="max-w-7xl mx-auto px-4 py-3">
        

        <div class="flex justify-between items-center">
            

            <div class="flex items-center space-x-6">
                <span class="text-gray-700 font-medium"><a href="{% url 'main' %}">Менеджер задач</a></span>
                <span class="text-gray-500"><a href="{% url 'users' %}">Пользователи</a></span>
            </div>


            <div class="flex items-center space-x-6">
                <span class="text-gray-500"><a href="{% url 'login' %}">Вход</a></span>
                <span class="text-gray-500"><a href="{% url 'user_create' %}">Регистрация</a></span>
                

                {% include "lang_form.html" with redirect_to=request.path %}
            </div>
        </div>
    </div>
    </header>

    {% if messages %}
        <div class="max-w-7xl mx-auto px-4 pt-4">
            {% for message in messages %}
                <div class="p-3 rounded-lg border mb-2 
                    {% if message.tags == 'success' %}
                        bg-green-50 border-green-200 text-green-700
                    {% elif message.tags == 'error' %}
                        bg-red-50 border-red-200 text-red-700
                    {% elif message.tags == 'warning' %}
                        bg-yellow-50 border-yellow-200 text-yellow-700
                    {% elif message.tags == 'info' %}
                        bg-blue-50 border-blue-200 text-blue-700
                    {% else %}
                        bg-gray-50 border-gray-200 text-gray-700
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}



    <main class="flex-grow pt-10">
        <div class="max-w-7xl mx-auto px-4">
            {% block content %}{% endblock %}
        </div>
    </main>


    <footer class="border-t border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-3 text-center text-sm text-gray-400">
            Hexlet
        </div>
    </footer>
</body>
</html>
