{% extends 'base.html' %}

{% block content %}


<div class="max-w-md ml-20 mt-8">
    
    <!-- Карточка -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-xl p-8 md:p-10">
        
        <!-- Заголовок: крупный и жирный -->
        <h2 class="text-2xl font-bold text-gray-900 mb-8 text-center tracking-tight">
            Вход
        </h2>

        <form method="post">
            {% csrf_token %}

            <!-- Поле Логина -->
            <div class="mb-6">
                <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
                    Имя пользователя
                </label>
                {{ form.username }}
            </div>

            <!-- Поле Пароля -->
            <div class="mb-6">
                <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
                    Пароль
                </label>
                {{ form.password }}
            </div>

            <!-- Ошибки формы -->
            {% if form.non_field_errors %}
                <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                    {{ form.non_field_errors.0 }}
                </div>
            {% endif %}

            <!-- Кнопка: теперь она идеально сочетается с полями -->
            
            <div class="mt-3">
            <button 
                type="submit" 
                class="inline-block px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded transition-colors">
                Войти
            </button>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</div>
{% endblock %}
