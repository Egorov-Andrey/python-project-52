{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4">
    <!-- Карточка подтверждения удаления -->
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
        <h2 class="text-lg font-medium text-gray-800 mb-2">Удаление пользователя</h2>
        
        <p class="text-gray-600 text-sm mb-4">
            Вы уверены, что хотите удалить пользователя 
            <span class="font-medium text-gray-800">"{{ user.username }}"</span>?
        </p>
        
        <p class="text-red-500 text-xs mb-4">
            ⚠️ Это действие необратимо. Все данные пользователя будут удалены.
        </p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="flex space-x-3">
                <!-- Кнопка подтверждения удаления (красная) -->
                <button type="submit" 
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-1.5 rounded transition-colors">
                    Да, удалить
                </button>
                
                <!-- Кнопка отмены (серая) -->
                <a href="{% url 'users' %}" 
                   class="flex-1 text-center bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium py-1.5 rounded transition-colors">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
