{% extends 'base_auth.html' %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
        <h2 class="text-lg font-medium text-gray-800 mb-4">
            {% if form.instance.pk %}Изменить статус{% else %}Создать статус{% endif %}
        </h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="{{ form.name.id_for_label }}" class="block text-sm text-gray-600 mb-1">
                    Имя
                </label>
                <input type="text" 
                       name="{{ form.name.name }}" 
                       id="{{ form.name.id_for_label }}"
                       value="{{ form.name.value|default:'' }}"
                       class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
                {% if form.name.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ form.name.errors.0 }}</p>
                {% endif %}
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-1.5 rounded transition-colors">
                {% if form.instance.pk %}Изменить{% else %}Создать{% endif %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
