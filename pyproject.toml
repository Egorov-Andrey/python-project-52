[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "django-tailwind-cli>=4.7.0",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "sentry-sdk>=2.70.0",
    "whitenoise[brotli]>=6.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["task_manager"]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ipython>=9.17.1",
    "pydotplus>=2.0.2",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.0",
]
